<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BharatVera"><meta name="theme-color" content="#0f3b5f"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<title>BharatVera</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;800&family=Noto+Sans+Telugu:wght@400;600;800&family=Outfit:wght@400;600;800&display=swap">
<style>
:root{--bg:#ffffff;--card:#ffffff;--ink:#0f2a44;--mut:#5b6b7c;--g:#0f3b5f;--g2:#1f7a3a;--gr:#2a8a2e;--on:#fff;--y:#f28a14;--yo:#0b2540;--line:#e2e8ee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Outfit','Noto Sans Devanagari','Noto Sans Telugu',system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px 16px 90px;min-height:100vh}
h1,h2,h3{margin:0}h1{font-size:26px;font-weight:800;line-height:1.25}h2{font-size:19px;font-weight:800;margin:18px 0 10px}h3{font-size:15px;font-weight:600;line-height:1.4}
.mut{color:var(--mut);font-size:13px;line-height:1.5}.lg{display:block;width:150px;height:150px;margin:0 auto 4px;border-radius:18px;background:#fff}.logo{font-weight:800;font-size:22px}.logo b{color:var(--y)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(15,59,95,.07)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:6px 0}
label{font-size:13px;font-weight:600}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--g);color:var(--on);font:inherit;font-weight:700;cursor:pointer;margin-top:10px}
.btn.s{width:auto;padding:8px 13px;margin:0;font-size:13px}.btn.o{background:transparent;color:var(--g);border:1.5px solid var(--g)}.btn.a{background:var(--y);color:var(--yo)}
.opt{display:block;width:100%;text-align:left;padding:15px;margin:8px 0;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.opt.on,.chip.on{border-color:var(--g);background:var(--g);color:var(--on)}
.chip{display:inline-block;padding:9px 14px;margin:4px 4px 0 0;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip.w{background:rgba(255,255,255,.2);border:0;color:inherit;cursor:default}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--gr);border-radius:9px}
.big{font-size:22px;font-weight:800}.tile{padding:18px;border-radius:20px;background:var(--g);color:var(--on);cursor:pointer;border:0;text-align:left;font:inherit}
.tile.y{background:var(--y);color:var(--yo)}.tile b{display:block;font-size:17px;margin:6px 0 2px}.tile span{font-size:12px;opacity:.85}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:10px 1px;border:0;background:none;color:var(--mut);font:inherit;font-size:10px;font-weight:600;cursor:pointer}nav button.on{color:var(--g)}nav i{display:block;font-style:normal;font-size:18px}
.err{color:#c0392b;font-size:13px;min-height:18px}.em{font-size:30px}.pill{display:inline-block;background:var(--y);color:var(--yo);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;display:none;z-index:9}
.cartbar{position:fixed;bottom:64px;left:16px;right:16px;max-width:448px;margin:0 auto}
video{width:100%;border-radius:16px;display:none;background:#000}.qr{background:#fff;padding:12px;border-radius:12px;width:170px;height:170px;margin:10px auto}.qr svg{width:100%;height:100%}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600}td.r{text-align:right;font-weight:600}.ok{color:var(--gr);font-weight:700}
.hero{background:linear-gradient(140deg,var(--g),var(--g2));color:var(--on);border-radius:22px;padding:22px;text-align:center}.av{width:44px;height:44px;border-radius:50%;background:var(--y);color:var(--yo);font-weight:800;font-size:18px;display:grid;place-items:center;border:0;cursor:pointer;font-family:inherit}.av.l{width:70px;height:70px;font-size:28px;margin:0 auto 10px}
.stp{display:flex;gap:10px;align-items:center;padding:6px 0;color:var(--mut);font-size:14px}.stp i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px}.stp.on{color:var(--ink);font-weight:600}.stp.on i{background:var(--g);border-color:var(--g);color:var(--on)}
@property --p{syntax:'<number>';inherits:false;initial-value:0}
.ring{width:96px;height:96px;flex:none;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}.ring>div{width:76px;height:76px;border-radius:50%;background:var(--card);display:grid;place-items:center;align-content:center;text-align:center;line-height:1.1}.ring b{font-size:26px}.ring span{font-size:11px;color:var(--mut)}
.sb{display:inline-block;min-width:40px;text-align:center;border-radius:99px;padding:4px 10px;font-weight:800;font-size:13px;color:#fff}
details summary{cursor:pointer;font-weight:600;font-size:14px;padding:6px 0}
</style>
