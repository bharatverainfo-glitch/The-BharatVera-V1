<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00897B">
<title>BharatVera App – Order food and groceries</title>
<meta name="description" content="Log in to BharatVera to place food and grocery orders, track delivery progress and leave feedback.">
<link rel="icon" href="favicon.png" type="image/png"><link rel="apple-touch-icon" href="icon-192.png">
<meta property="og:type" content="website"><meta property="og:title" content="BharatVera App – Order food and groceries"><meta property="og:description" content="Place food and grocery orders and track every step of delivery.">
<meta property="og:image" content="https://YOUR-USERNAME.github.io/YOUR-REPO/og-image.png"><meta property="og:image:alt" content="BharatVera logo"><meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined" rel="stylesheet">
<style>
:root{--brand:#00897B;--brand-d:#00695C;--bg:#F5F5F5;--tx:#333;--mut:#757575;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Roboto,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:84px}
.material-symbols-outlined{font-size:20px;vertical-align:middle;font-variation-settings:'wght' 300}
header{background:var(--brand);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:20px;letter-spacing:.2px}header small{opacity:.9}
main{max-width:760px;margin:0 auto;padding:16px}
h2{margin:4px 0 14px;font-size:20px}h3{margin:18px 0 8px;font-size:16px}
.card{background:var(--card);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:14px;margin-bottom:12px}
.card.tap{cursor:pointer}.card.tap:active{transform:scale(.99)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}
.badge{display:inline-flex;align-items:center;gap:4px;border:1px solid;border-radius:999px;padding:3px 10px 3px 6px;font-size:13px;font-weight:600}
.badge .material-symbols-outlined{font-size:16px}
button,.btn{font:inherit;background:var(--brand);color:#fff;border:0;border-radius:999px;padding:11px 20px;font-weight:600;cursor:pointer}
button:hover{background:var(--brand-d)}button:disabled{background:#BDBDBD;cursor:not-allowed}
button.sec{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}button.danger{background:#F44336}button.link{background:none;color:var(--brand);padding:6px}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border:1px solid #ccc;border-radius:8px;margin:4px 0 12px;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
label{font-size:13px;font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(0,0,0,.1);z-index:5}
nav a,nav button.nv{flex:1;text-align:center;color:var(--mut);text-decoration:none;font-size:12px;background:none;border-radius:0;padding:4px;font-weight:500}
nav a.on{color:var(--brand);font-weight:700}nav span{display:block;margin:0 auto}
.tl{border-left:3px solid #ddd;margin-left:10px;padding-left:16px}.tl>div{position:relative;margin-bottom:14px}
.tl>div:before{content:"";position:absolute;left:-24px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--c,#9E9E9E);border:2px solid #fff;box-shadow:0 0 0 1px var(--c,#9E9E9E)}
.stars button{background:none;color:#FFB300;font-size:30px;padding:0 3px;line-height:1}.stars button:hover{background:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.grid button{border-radius:10px}
.stat{font-size:28px;font-weight:700;color:var(--brand)}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px}.chart div{flex:1;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.chart i{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:11px;font-style:normal}
.lbls{display:flex;gap:4px}.lbls span{flex:1;text-align:center;font-size:10px;color:var(--mut);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 6px;text-align:left;border-bottom:1px solid #eee;white-space:nowrap}
.scroll{overflow-x:auto}tr.tap{cursor:pointer}tr.tap:hover{background:#f0faf9}
.ft{text-align:center;margin-top:20px;font-size:13px}.ft a{margin:0 8px;color:var(--brand)}.auth{max-width:400px;margin:8vh auto 0;text-align:center}.auth h1{color:var(--brand);margin:0}.auth form{text-align:left}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90%}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<div id="app"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="site.js"></script>
<script>
const C=window.BV_CONFIG||{};
const STATUS={New:['hourglass_empty','#333333','#9E9E9E'],Accepted:['check','#1B5E20','#4CAF50'],Preparing:['restaurant','#E65100','#FF9800'],'Ready for pickup':['notifications','#0D47A1','#2196F3'],'Picked up':['inventory_2','#4A148C','#9C27B0'],'Out for delivery':['local_shipping','#004D40','#009688'],Delivered:['check_circle','#1B5E20','#4CAF50'],Cancelled:['cancel','#B71C1C','#F44336']};
const FLOW=[['Accept Order','Accepted','New'],['Start Preparing','Preparing','Accepted'],['Mark Ready for Pickup','Ready for pickup','Preparing'],['Mark Picked Up','Picked up','Ready for pickup'],['Start Delivery','Out for delivery','Picked up'],['Mark Delivered','Delivered','Out for delivery']];
const TS={Accepted:'accepted_at',Preparing:'preparing_at','Ready for pickup':'ready_at','Picked up':'picked_up_at','Out for delivery':'out_for_delivery_at',Delivered:'delivered_at',Cancelled:'cancelled_at'};
const MSG={New:'Order placed, waiting for confirmation',Accepted:'Accepted by the store',Preparing:'Being prepared',['Ready for pickup']:'Ready for pickup by the rider','Picked up':'Picked up by the rider','Out for delivery':'On the way to you',Delivered:'Delivered. Rate your order',Cancelled:'This order was cancelled'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?new Date(d).toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const stars=r=>r?'★'.repeat(r)+'☆'.repeat(5-r):'—';
const badge=s=>{const[i,t,h]=STATUS[s]||STATUS.New;return `<span class="badge" style="color:${t};background:${h}26;border-color:${h}"><span class="material-symbols-outlined">${i}</span>${esc(s)}</span>`};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3200)}
async function notify(o,st){const p={to:o.user_email,subject:`BharatVera Order Update – ${o.order_id}`,body:`Hello,\n\nYour order ${o.order_id} status has been updated to: ${st}.\n\nThank you for choosing BharatVera.`};
 if(C.NOTIFY_URL){try{await fetch(C.NOTIFY_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})}catch(e){}}
 toast(`Customer notified: ${p.subject}`)}

/* ---------- Data layer: Supabase (if configured) or browser demo ---------- */
const L={get:k=>JSON.parse(localStorage.getItem('bv_'+k)||'null'),set:(k,v)=>localStorage.setItem('bv_'+k,JSON.stringify(v))};
const nid=(p,k)=>{const n=(L.get('seq_'+k)||0)+1;L.set('seq_'+k,n);return p+String(n).padStart(3,'0')};
const demo={
 users(){let u=L.get('users');if(!u){u=[{id:'U001',email:'admin@bharatvera.in',pw:'admin123',name:'BharatVera Admin',role:'Admin'}];L.set('users',u)}return u},
 async me(){return this.users().find(u=>u.email===L.get('me'))||null},
 async login(e,p){const u=this.users().find(x=>x.email===e.toLowerCase()&&x.pw===p);if(!u)throw Error('Wrong email or password');L.set('me',u.email);return u},
 async signup(e,p,n,ph){const us=this.users();e=e.toLowerCase();if(us.some(u=>u.email===e))throw Error('This email is already registered');us.push({id:nid('U','u'),email:e,pw:p,name:n,phone:ph,role:'Customer'});L.set('users',us);return this.login(e,p)},
 async logout(){localStorage.removeItem('bv_me')},
 async orders(){const me=await this.me(),o=L.get('orders')||[];return(me.role==='Admin'?o:o.filter(x=>x.user_email===me.email)).sort((a,b)=>b.order_date.localeCompare(a.order_date))},
 async addOrder(o){const me=await this.me(),id=nid('O','o'),r={...o,order_id:id,user_email:me.email,order_status:'New',order_date:new Date().toISOString()};L.set('orders',[...(L.get('orders')||[]),r]);this.log(id,'New',me.email,'Order placed')},
 log(id,st,by,note){L.set('timings',[...(L.get('timings')||[]),{timing_id:nid('T','t'),order_id:id,order_status:st,event_time:new Date().toISOString(),updated_by:by,note:note||''}])},
 async setStatus(id,st,note){const me=await this.me(),now=new Date().toISOString(),os=L.get('orders');const o=os.find(x=>x.order_id===id);o.order_status=st;o[TS[st]]=now;L.set('orders',os);this.log(id,st,me.email,note)},
 async timings(id){return(L.get('timings')||[]).filter(t=>t.order_id===id)},
 async feedback(id,r,n){const me=await this.me(),os=L.get('orders'),o=os.find(x=>x.order_id===id);o.rating=r;o.feedback_note=n;o.feedback_id=o.feedback_id||nid('F','f');o.feedback_at=new Date().toISOString();o.feedback_by=me.email;L.set('orders',os)}
};
const sb=C.SUPABASE_URL&&window.supabase?supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY):null;
const live={
 async me(){const{data:{session}}=await sb.auth.getSession();if(!session)return null;const{data}=await sb.from('bv_profiles').select('*').eq('id',session.user.id).single();return data},
 async login(e,p){const{error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)throw error;return this.me()},
 async signup(e,p,n,ph){const{error}=await sb.auth.signUp({email:e,password:p,options:{data:{name:n,phone:ph}}});if(error)throw error;return this.login(e,p)},
 async logout(){await sb.auth.signOut()},
 async orders(){const[a,b]=await Promise.all([sb.from('bv_orders').select('*').order('order_date',{ascending:false}),sb.from('bv_feedbacks').select('*')]);if(a.error)throw a.error;const f=Object.fromEntries((b.data||[]).map(x=>[x.order_id,x]));
  return a.data.map(o=>{const x=f[o.order_id];return x?{...o,rating:x.rating,feedback_note:x.feedback_note,feedback_id:x.feedback_id,feedback_at:x.submitted_at,feedback_by:x.submitted_by}:o})},
 async addOrder(o){const{error}=await sb.from('bv_orders').insert(o);if(error)throw error},
 async setStatus(id,st,note){const{error}=await sb.from('bv_orders').update({order_status:st,status_note:note||null}).eq('order_id',id);if(error)throw error},
 async timings(id){const{data}=await sb.from('bv_order_timings').select('*').eq('order_id',id);return data||[]},
 async feedback(id,r,n){const me=await this.me();const{error}=await sb.from('bv_feedbacks').upsert({order_id:id,rating:r,feedback_note:n,submitted_by:me.email,submitted_at:new Date().toISOString()},{onConflict:'order_id'});if(error)throw error}
};
const DB=sb?live:demo;

/* ---------- App ---------- */
const S={me:null,orders:[],mode:'login',rating:0,fStatus:'',fDate:'',days:7};
const app=h=>{$('#app').innerHTML=h};
const isA=()=>S.me?.role==='Admin';
async function boot(){try{S.me=await DB.me();if(S.me)S.orders=await DB.orders()}catch(e){toast(e.message)}view()}
function authV(){const su=S.mode==='signup';return `<main class="auth"><img src="logo.png" alt="BharatVera logo: a lotus-like plant rising from two leaves" width="180" height="180" style="max-width:55%;height:auto"><h1 style="font-size:0;line-height:0">BharatVera</h1><p class="mut">Food and grocery, delivered to you.</p><div class="card"><form id="af">
 ${su?'<label>Name</label><input name="name" required autocomplete="name"><label>Phone (optional)</label><input name="phone" type="tel" autocomplete="tel">':''}
 <label>Email</label><input name="email" type="email" required autocomplete="email"><label>Password</label><input name="pw" type="password" minlength="6" required autocomplete="${su?'new':'current'}-password">
 <button style="width:100%">${su?'Create account':'Log in'}</button></form>
 <button class="link" data-act="mode">${su?'Already registered? Log in':'New here? Create an account'}</button></div>
 ${sb?'':'<p class="mut">Demo mode: data stays in this browser. Admin login: admin@bharatvera.in / admin123</p>'}<footer class="ft"><a href="index.html">Home</a><a href="faq.html">FAQ</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy policy</a></footer></main>`}
function shell(body){const h=location.hash.slice(1)||'/',t=(p,i,l)=>`<a href="#${p}" class="${h===p?'on':''}"><span class="material-symbols-outlined">${i}</span>${l}</a>`;
 app(`<header><b><img src="favicon.png" alt="BharatVera logo mark" width="28" height="28" style="vertical-align:middle;border-radius:6px;background:#fff;margin-right:8px">BharatVera</b><small>${esc(S.me.name||S.me.email)} · ${S.me.role}</small></header><main>${body}</main><nav>${isA()?t('/','dashboard','Dashboard')+t('/orders','list_alt','Orders')+t('/fb','reviews','Feedback'):t('/','receipt_long','My Orders')+t('/new','add_circle','Place Order')}<button class="nv" data-act="logout"><span class="material-symbols-outlined">logout</span>Log out</button></nav>`);const f=document.createElement('div');f.innerHTML='<footer class="ft"><a href="index.html">Home</a><a href="faq.html">FAQ</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy policy</a></footer>';$('main').appendChild(f.firstChild)}
const mini=o=>`<div class="card tap" data-go="/o/${o.order_id}"><div class="row"><b>${o.order_id}</b>${badge(o.order_status)}</div><div class="mut">${o.order_type} · ${fmt(o.order_date)}${isA()?' · '+esc(o.user_email):''}</div><div>${esc(MSG[o.order_status])}</div></div>`;
function custHome(){return `<h2>My Orders</h2>${S.orders.map(mini).join('')||'<div class="card">No orders yet. Tap Place Order to start.</div>'}`}
function newV(){return `<h2>Place Order</h2><form class="card" id="nf"><label>Order type</label><select name="t"><option>Food</option><option>Grocery</option></select>
 <label>Items</label><textarea name="i" rows="4" required placeholder="e.g. 2 veg biryani, 1 raita"></textarea><label>Delivery note (optional)</label><input name="n" placeholder="Gate code, landmark…">
 <p class="mut">Order date: ${fmt(new Date())} (automatic)</p><button>Place order</button></form>`}
async function detailV(id){const o=S.orders.find(x=>x.order_id===id);if(!o)return '<div class="card">Order not found.</div>';const tm=(await DB.timings(id)).sort((a,b)=>a.event_time.localeCompare(b.event_time));const A=isA();
 const tl=`<div class="tl">${tm.map(t=>`<div style="--c:${(STATUS[t.order_status]||STATUS.New)[2]}">${badge(t.order_status)}<div class="mut">${fmt(t.event_time)}${A?' · by '+esc(t.updated_by):''}</div>${t.note&&A?`<div>${esc(t.note)}</div>`:''}</div>`).join('')}</div>`;
 let x=`<button class="link" data-go="${A?'/orders':'/'}">← Back</button><div class="card"><div class="row"><h2 style="margin:0">${o.order_id}</h2>${badge(o.order_status)}</div>
 <p>${o.order_type}${A?' · '+esc(o.user_email):''}<br><b>Items:</b> ${esc(o.items_summary)}<br><b>Ordered:</b> ${fmt(o.order_date)}<br><b>Delivery note:</b> ${esc(o.delivery_note)||'—'}</p>
 ${A?`<p class="mut">${Object.entries(TS).map(([s,k])=>`${s}: ${fmt(o[k])}`).join('<br>')}</p>`:''}</div>`;
 if(A)x+=`<div class="card"><h3 style="margin-top:0">Update status</h3><input id="nt" placeholder="Note (optional)"><div class="grid">${FLOW.map(([l,s,p])=>`<button data-act="st" data-id="${id}" data-s="${s}" ${o.order_status===p?'':'disabled'}>${l}</button>`).join('')}<button class="danger" data-act="st" data-id="${id}" data-s="Cancelled" ${['Delivered','Cancelled'].includes(o.order_status)?'disabled':''}>Cancel Order</button></div></div>`;
 x+=`<div class="card"><h3 style="margin-top:0">Order timeline</h3>${tl}</div>`;
 if(o.order_status==='Delivered'){if(A)x+=`<div class="card"><b>Feedback</b><br>${stars(o.rating)}<br>${esc(o.feedback_note)||'<span class="mut">No feedback yet</span>'}</div>`;
  else{const r=S.rating||o.rating||0;x+=`<div class="card"><h3 style="margin-top:0">Rate your order</h3><div class="stars">${[1,2,3,4,5].map(n=>`<button data-act="star" data-v="${n}" aria-label="${n} stars">${n<=r?'★':'☆'}</button>`).join('')}</div>
  <label>Feedback</label><textarea id="fn" rows="3">${esc(o.feedback_note)}</textarea><button data-act="fb" data-id="${id}">Save feedback</button></div>`}}
 return x}
function dayKey(d){return new Date(d).toDateString()}
function dashV(){const o=S.orders,td=o.filter(x=>dayKey(x.order_date)===dayKey(new Date())),pen=o.filter(x=>!['Delivered','Cancelled'].includes(x.order_status)),fb=o.filter(x=>x.rating).sort((a,b)=>(b.feedback_at||'').localeCompare(a.feedback_at||'')).slice(0,8);
 const ds=[...Array(S.days)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(S.days-1-i));return d}),cn=ds.map(d=>o.filter(x=>dayKey(x.order_date)===dayKey(d)).length),mx=Math.max(1,...cn);
 return `<h2>Dashboard</h2><div class="grid"><div class="card"><div class="stat">${td.length}</div>Today's orders</div><div class="card"><div class="stat">${pen.length}</div>Pending orders</div></div>
 <div class="row"><h3>Orders per day</h3><select id="dy" style="width:auto"><option value="7" ${S.days==7?'selected':''}>Last 7 days</option><option value="30" ${S.days==30?'selected':''}>Last 30 days</option></select></div>
 <div class="card"><div class="chart">${cn.map(c=>`<div style="height:${c/mx*100}%"><i>${c||''}</i></div>`).join('')}</div><div class="lbls">${ds.map(d=>`<span>${S.days>7?d.getDate():d.toLocaleDateString([], {weekday:'short'})}</span>`).join('')}</div></div>
 <h3>Today's orders</h3>${td.map(mini).join('')||'<div class="card mut">No orders today.</div>'}<h3>Pending orders</h3>${pen.map(mini).join('')||'<div class="card mut">Nothing pending.</div>'}
 <h3>Recent feedback</h3>${fb.map(fbCard).join('')||'<div class="card mut">No feedback yet.</div>'}`}
const fbCard=o=>`<div class="card tap" data-go="/o/${o.order_id}"><div class="row"><b>${o.order_id}</b><span style="color:#FFB300">${stars(o.rating)}</span></div><div>${esc(o.feedback_note)||'<span class="mut">No comment</span>'}</div><div class="mut">${esc(o.feedback_by||o.user_email)} · ${fmt(o.feedback_at)}</div></div>`;
function ordersV(){const f=S.orders.filter(o=>(!S.fStatus||o.order_status===S.fStatus)&&(!S.fDate||dayKey(o.order_date)===dayKey(S.fDate+'T00:00')));
 return `<h2>Orders</h2><div class="card row"><select id="fs" style="flex:1;margin:0"><option value="">All statuses</option>${Object.keys(STATUS).map(s=>`<option ${S.fStatus===s?'selected':''}>${s}</option>`).join('')}</select><input type="date" id="fd" value="${S.fDate}" style="flex:1;margin:0"></div>
 <div class="card scroll"><table><tr><th>Order</th><th>User</th><th>Type</th><th>Status</th><th>Ordered</th><th>Delivered</th><th>Rating</th></tr>${f.map(o=>`<tr class="tap" data-go="/o/${o.order_id}"><td><b>${o.order_id}</b></td><td>${esc(o.user_email)}</td><td>${o.order_type}</td><td>${badge(o.order_status)}</td><td>${fmt(o.order_date)}</td><td>${fmt(o.delivered_at)}</td><td>${stars(o.rating)}</td></tr>`).join('')||'<tr><td colspan="7">No matching orders.</td></tr>'}</table></div>`}
function fbV(){const f=S.orders.filter(o=>o.rating).sort((a,b)=>(b.feedback_at||'').localeCompare(a.feedback_at||''));
 return `<h2>Feedback</h2><div class="card scroll"><table><tr><th>ID</th><th>Order</th><th>Rating</th><th>Note</th><th>By</th><th>Submitted</th></tr>${f.map(o=>`<tr class="tap" data-go="/o/${o.order_id}"><td>${o.feedback_id||''}</td><td>${o.order_id}</td><td style="color:#FFB300">${stars(o.rating)}</td><td style="white-space:normal;min-width:160px">${esc(o.feedback_note)}</td><td>${esc(o.feedback_by||o.user_email)}</td><td>${fmt(o.feedback_at)}</td></tr>`).join('')||'<tr><td colspan="6">No feedback yet.</td></tr>'}</table></div>`}
async function view(){if(!S.me){document.title='Log in – BharatVera';return app(authV())}const h=location.hash.slice(1)||'/',m=h.match(/^\/o\/(.+)/),A=isA();let b;
 if(m)b=await detailV(m[1]);else if(A)b=h==='/orders'?ordersV():h==='/fb'?fbV():dashV();else b=h==='/new'?newV():custHome();document.title=!S.me?'Log in – BharatVera':m?`Order ${m[1]} – BharatVera`:({'/':A?'Dashboard':'My Orders','/orders':'All Orders','/fb':'Customer Feedback','/new':'Place Order'}[h]||'BharatVera')+' – BharatVera';shell(b)}
async function run(f){try{await f()}catch(e){toast(e.message||'Something went wrong. Try again.')}}
const refresh=async()=>{S.orders=await DB.orders();view()};
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)return location.hash=g.dataset.go;const b=e.target.closest('[data-act]');if(!b)return;const d=b.dataset;
 run(async()=>{if(d.act==='mode'){S.mode=S.mode==='login'?'signup':'login';view()}
 else if(d.act==='logout'){await DB.logout();S.me=null;S.orders=[];location.hash='';view()}
 else if(d.act==='star'){S.rating=+d.v;const o=$('#fn')?.value;await view();if($('#fn'))$('#fn').value=o}
 else if(d.act==='st'){const o=S.orders.find(x=>x.order_id===d.id),n=$('#nt').value;b.disabled=true;await DB.setStatus(d.id,d.s,n);await notify(o,d.s);await refresh()}
 else if(d.act==='fb'){const r=S.rating||S.orders.find(x=>x.order_id===d.id).rating;if(!r)return toast('Choose a star rating first');await DB.feedback(d.id,r,$('#fn').value);S.rating=0;toast('Feedback saved');await refresh()}})});
document.addEventListener('submit',e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
 run(async()=>{if(e.target.id==='af'){S.me=S.mode==='signup'?await DB.signup(f.email,f.pw,f.name,f.phone):await DB.login(f.email,f.pw);location.hash='';await refresh()}
 else if(e.target.id==='nf'){await DB.addOrder({order_type:f.t,items_summary:f.i,delivery_note:f.n||null});toast('Order placed');location.hash='/';await refresh()}})});
document.addEventListener('change',e=>{if(e.target.id==='fs'){S.fStatus=e.target.value;view()}if(e.target.id==='fd'){S.fDate=e.target.value;view()}if(e.target.id==='dy'){S.days=+e.target.value;view()}});
window.addEventListener('hashchange',()=>{S.rating=0;view()});
if(sb)sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'){S.me=null;view()}});
boot();
</script></body></html>
